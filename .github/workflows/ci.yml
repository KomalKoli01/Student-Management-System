name: Student Management System CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Verify student management files
        run: |
          echo "Checking Student Management System..."
          test -f index.html
          echo "index.html found successfully"
          echo "Student Management System CI completed successfully!"
